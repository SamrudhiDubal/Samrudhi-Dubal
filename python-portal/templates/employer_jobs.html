{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>My job postings</h3><a class="btn btn-primary" href="{{ url_for('job_new') }}">Post a job</a>
</div>
<table class="table bg-white shadow-sm">
  <thead><tr><th>Title</th><th>Status</th><th>Applicants</th><th></th></tr></thead>
  <tbody>
  {% for job in jobs %}
    <tr>
      <td><a href="{{ url_for('job_detail', job_id=job.id) }}">{{ job.title }}</a></td>
      <td>{{ job.status }}</td>
      <td>{{ job.applications|length }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-success" href="{{ url_for('applicants', job_id=job.id) }}">Ranked applicants</a>
        <a class="btn btn-sm btn-info" href="{{ url_for('candidate_matches', job_id=job.id) }}">AI candidate matches</a>
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('job_edit', job_id=job.id) }}">Edit</a>
        <form class="d-inline" method="post" action="{{ url_for('job_toggle', job_id=job.id) }}">
          <button class="btn btn-sm btn-outline-warning">{{ 'Close' if job.status=='open' else 'Reopen' }}</button></form>
        <form class="d-inline" method="post" action="{{ url_for('job_delete', job_id=job.id) }}" onsubmit="return confirm('Delete this job?')">
          <button class="btn btn-sm btn-outline-danger">Delete</button></form>
      </td>
    </tr>
  {% else %}<tr><td colspan="4" class="text-muted">No jobs yet.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
