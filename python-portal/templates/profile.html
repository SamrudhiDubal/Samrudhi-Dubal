{% extends 'base.html' %}
{% block content %}
<h3>Your profile</h3>
<form method="post" enctype="multipart/form-data" class="card card-body shadow-sm mb-3">
  <label class="form-label">Name</label>
  <input class="form-control mb-2" name="name" value="{{ current_user.name }}">
  <label class="form-label">Skills (comma-separated)</label>
  <input class="form-control mb-2" name="skills" value="{{ current_user.skills or '' }}" placeholder="python, sql, machine learning">
  <label class="form-label">Resume (PDF, DOCX or TXT) {% if current_user.resume_text %}<span class="text-success">&check; on file</span>{% endif %}</label>
  <input class="form-control mb-3" type="file" name="resume" accept=".pdf,.docx,.txt">
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
