{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Login</h3>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0 small text-center">No account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
  </div></div>
  <div class="alert alert-light border small mt-3">
    <strong>Demo accounts</strong> (after <code>python seed.py</code>), password <code>password123</code>:<br>
    admin@jobmatch.ai · hr@techsoft.com · priya@example.com
  </div>
</div></div>
{% endblock %}
