{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Create an account</h3>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">I am a</label>
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="role" id="r-cand" value="candidate" {% if request.form.get('role', 'candidate') == 'candidate' %}checked{% endif %} onchange="toggleCompany()">
          <label class="btn btn-outline-primary" for="r-cand"><i class="bi bi-person"></i> Job seeker</label>
          <input type="radio" class="btn-check" name="role" id="r-emp" value="employer" {% if request.form.get('role') == 'employer' %}checked{% endif %} onchange="toggleCompany()">
          <label class="btn btn-outline-primary" for="r-emp"><i class="bi bi-building"></i> Employer</label>
        </div>
      </div>
      <div class="mb-3"><label class="form-label">Full name</label><input name="name" class="form-control" value="{{ request.form.get('name', '') }}" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ request.form.get('email', '') }}" required></div>
      <div class="mb-3" id="company-field"><label class="form-label">Company name</label><input name="company" class="form-control" value="{{ request.form.get('company', '') }}"></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" minlength="6" required></div>
      <button class="btn btn-primary w-100">Create account</button>
    </form>
    <p class="mt-3 mb-0 small text-center">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div></div>
</div></div>
<script>
  function toggleCompany() {
    document.getElementById('company-field').style.display =
      document.getElementById('r-emp').checked ? '' : 'none';
  }
  toggleCompany();
</script>
{% endblock %}
